# key list in views/admin/layout/ckEditorJs.cfm (which translates each key
# server-side into cfrequest.tiptapI18n for the JS to consume).
#
# Localise by adding tiptap_<lang>.properties alongside this file (in a site
# or another extension) - standard Preside resource-bundle overrides.
#
# {count} / {name} placeholders are substituted client-side - keep them verbatim.

